name: Build site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MkDocs
        run: pip install -r requirements.txt
      - name: Check published files match the MkDocs build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python scripts/sync_site.py --check
