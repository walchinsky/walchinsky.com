site_name: Walchinsky
site_url: https://walchinsky.com/
site_description: Personal website of Matthew Walchinsky.
site_author: Matthew Walchinsky
copyright: Copyright &copy; 2026 Matthew Walchinsky

nav:
  - Home: index.md
  - About: about.md
  - Contact: contact.md

# Files that belong in the build but not in the nav.
not_in_nav: |
  robots.txt
  CNAME
  assets/**
  stylesheets/**

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore
    unrecognized_links: ignore

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/walchinsky
      name: Matthew Walchinsky on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/walchinsky
      name: Matthew Walchinsky on GitLab
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/walchinsky
      name: Matthew Walchinsky on LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:matthew@walchinsky.com
      name: Email Matthew Walchinsky

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins: []
